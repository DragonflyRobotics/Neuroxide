[workspace]
members = [
    "crates/neuroxide",
    "crates/mempool",
    "crates/cuda",
    "crates/ops",
    "crates/types",
    "bin"
]
resolver = "3"


[workspace.dependencies]
neuroxide = { path = "crates/neuroxide" }
cuda = { path = "crates/cuda" }
mempool = { path = "crates/mempool" }
types = { path = "crates/types" }
ops = { path = "crates/ops" }
approx = "0.5.1"
libc = "0.2.174"
num = "0.4.3"
once_cell = "1.21.3"
petgraph = "0.8.2"
rand = "0.9.2"
pkg-config = "0.3.32"
trait-set = "0.3.0"
cc = "1.2.3"
blas-src = { version = "0.14", features = ["openblas"] }
cblas = "0.5.0"
