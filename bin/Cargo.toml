[package]
name = "neuroxide_main"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "neuroxide_main"
path = "src/main.rs"

[[bench]]
name = "neuroxide_bench"
path = "../bench/bench.rs"

[dependencies]
neuroxide = { workspace = true }
mempool.workspace = true
approx.workspace = true
serde_json = "1.0.142"
serde = "1.0.219"
rand.workspace = true
# Other dependencies inherited from workspace


[features]
cuda = ["neuroxide/cuda"]  # propagates feature to crates
default = []
